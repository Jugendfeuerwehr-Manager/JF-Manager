# Security headers for files served by Nginx itself. nginx drops inherited
# add_header directives in any block that declares its own, so every location
# with add_header must include this file. Proxied Django responses carry their
# own X-Frame-Options, nosniff, Referrer- and Opener-Policy and only include
# csp-report-only.conf.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
include /etc/nginx/snippets/csp-report-only.conf;
