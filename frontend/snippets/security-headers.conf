# Security headers for files served by Nginx itself. nginx drops inherited
# add_header directives in any block that declares its own, so every location
# with add_header must include this file. Proxied Django responses carry their
# own headers, including CSP and Permissions-Policy (jf_manager_backend.csp).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Values from nginx.conf; the empty one of the two is not sent.
add_header Content-Security-Policy $jf_csp_enforce always;
add_header Content-Security-Policy-Report-Only $jf_csp_report_only always;
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=()" always;
