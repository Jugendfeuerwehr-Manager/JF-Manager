worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Preserve HTTPS from an upstream TLS-terminating proxy, but only from
    # addresses listed in trusted-proxies.conf. The image default trusts every
    # address (previous behaviour); jfctl installs a narrowed list (OPS-01.1).
    geo $jf_trusted_proxy {
        default 0;
        include /etc/nginx/trusted-proxies.conf;
    }

    map "$jf_trusted_proxy:$http_x_forwarded_proto" $client_scheme {
        "1:https" https;
        default $scheme;
    }

    # Content-Security-Policy for files served by nginx (SEC-13); proxied
    # Django responses carry their own. Keep identical to CSP_DIRECTIVES in
    # backend/jf_manager_backend/settings.py (api_tests.test_csp_policy).
    map $host $jf_csp_policy {
        default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; frame-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; report-uri /api/v1/security/csp-report/";
    }

    # Enforced unless csp-mode.conf says "report-only" (jfctl renders it from
    # CSP_REPORT_ONLY in app.env). add_header skips empty values, so exactly
    # one of the two headers is sent (snippets/security-headers.conf).
    map $host $jf_csp_mode {
        include /etc/nginx/csp-mode.conf;
    }
    map $jf_csp_mode $jf_csp_enforce {
        report-only "";
        default $jf_csp_policy;
    }
    map $jf_csp_mode $jf_csp_report_only {
        report-only $jf_csp_policy;
        default "";
    }

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 4096;
    client_max_body_size 100M;

    # Gzip Settings
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss 
               application/rss+xml font/truetype font/opentype 
               application/vnd.ms-fontobject image/svg+xml;
    gzip_disable "msie6";

    # Security headers: set per location via /etc/nginx/snippets/*.conf, because
    # add_header here would be dropped wherever a location sets its own header.

    # Include additional configuration files
    include /etc/nginx/conf.d/*.conf;
}
