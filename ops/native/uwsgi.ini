; uWSGI for the native Debian 13 installation (jf-manager-web.service).
; Paths are fixed by the jfctl layout; settings come from the environment.
[uwsgi]
http-socket = 127.0.0.1:8000
chdir = /opt/jf-manager/current/backend
wsgi-file = jf_manager_backend/wsgi.py
virtualenv = /opt/jf-manager/current/venv
master = true
need-app = true
strict = true
die-on-term = true
vacuum = true
max-requests = 5000
harakiri = 120
processes = 2
threads = 2
buffer-size = 16384
post-buffering = 8192
disable-logging = false
log-x-forwarded-for = true
