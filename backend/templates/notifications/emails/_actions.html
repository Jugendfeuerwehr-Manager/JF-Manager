<p style="margin: 20px 0;">{% for a in actions %}<a href="{{ a.url }}" style="display: inline-block; margin: 0 8px 8px 0; padding: 10px 16px; border-radius: 8px; text-decoration: none; font-weight: 600;{% if a.style == 'primary' %} background: {{ org.color|default:'#B91C1C' }}; color: #FFFFFF;{% else %} border: 1px solid #D5DAE3; color: #172033;{% endif %}">{{ a.label }}</a>{% endfor %}</p>
