name: CI

on:
  push:
    branches:
      - main
      - nextgeneration-frontend
  pull_request:
    branches:
      - main
  # Release tags run the full test suite through build-push.yml before any
  # image or release package is published (OPS-03.3).
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        # Same major version as both production paths (OPS-05).
        image: postgres:17-alpine
        env:
          POSTGRES_DB: test_jf_manager
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # docker_settings reads DATABASE_URL; the default settings would use SQLite
      # and skip the PostgreSQL-only ledger and concurrency tests.
      DJANGO_SETTINGS_MODULE: jf_manager_backend.docker_settings
      DATABASE_URL: postgres://test_user:test_password@localhost:5432/test_jf_manager
      DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      STATIC_ROOT: /tmp/jf-static
      MEDIA_ROOT: /tmp/jf-media
      REDIS_URL: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pipenv
          cache-dependency-path: backend/Pipfile.lock

      - name: Install pipenv
        run: pip install pipenv==2026.5.2

      - name: Install LDAP build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libldap2-dev libsasl2-dev libssl-dev

      - name: Install dependencies
        working-directory: backend
        run: pipenv install --deploy --system

      - name: Install test tools
        run: pip install coverage

      - name: Generate ephemeral test encryption key
        run: |
          python - <<'PYKEY'
          import os
          from cryptography.fernet import Fernet
          with open(os.environ["GITHUB_ENV"], "a") as environment:
              environment.write("FIELD_ENCRYPTION_KEY=" + Fernet.generate_key().decode() + "\n")
          PYKEY

      - name: Check for missing migrations
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests with coverage
        working-directory: backend
        run: |
          coverage run manage.py test --noinput --verbosity=2 \
            api_tests users departments.tests external_sync.tests inventory.tests \
            servicebook.tests training.tests notifications orders.tests members \
            qualifications settings_manager
          coverage xml -o coverage.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml
          retention-days: 14

  lint-backend:
    name: Backend Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        working-directory: backend
        run: ruff check . --output-format=github

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Audit backend lockfile
        working-directory: backend
        run: |
          pip install pipenv==2026.5.2 pip-audit==2.10.1
          pipenv requirements > /tmp/requirements.txt
          pip-audit --requirement /tmp/requirements.txt --no-deps --disable-pip --strict

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Shipped packages must be clean; build and test tools may only carry
      # findings below "critical" until upstream fixes exist (see SEC-10).
      - name: Audit frontend runtime dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=low

      - name: Audit frontend tooling
        working-directory: frontend
        run: npm audit --audit-level=critical

  test-frontend:
    name: Frontend Tests & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript type check
        working-directory: frontend
        run: npm run type-check

      - name: ESLint
        working-directory: frontend
        run: npm run lint -- --no-fix

      - name: Unit tests with coverage
        working-directory: frontend
        run: npm run test:unit -- --coverage --reporter=verbose

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 14

  ops:
    name: Operations Tooling
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ShellCheck and bats
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck bats

      - name: ShellCheck
        run: shellcheck -x ops/jfctl ops/lib/*.sh ops/release/build-release.sh ops/proxmox/jf-lxc.sh backend/docker-entrypoint.sh

      - name: jfctl tests
        run: bats ops/tests

      - name: Production compose file
        run: |
          printf '%s\n' JF_VERSION=0.0.0 JF_BACKEND_IMAGE=b JF_FRONTEND_IMAGE=f POSTGRES_PASSWORD=x \
            JF_DOMAIN=example.org JF_ACME_EMAIL=a@example.org JF_APP_ENV=/dev/null JF_TRUSTED_PROXIES_FILE=/dev/null >/tmp/compose.env
          docker compose -f ops/compose/compose.yml --env-file /tmp/compose.env --profile tls config -q

      - name: Nginx configuration
        run: |
          docker run --rm --add-host backend:127.0.0.1 \
            -v "$PWD/frontend/nginx.conf:/etc/nginx/nginx.conf:ro" -v "$PWD/frontend/conf.d:/etc/nginx/conf.d:ro" \
            -v "$PWD/frontend/snippets:/etc/nginx/snippets:ro" -v "$PWD/frontend/trusted-proxies.conf:/etc/nginx/trusted-proxies.conf:ro" \
            nginx:1.27-alpine nginx -t

      - name: Caddy configuration
        run: |
          docker run --rm -e JF_DOMAIN=example.org -e JF_ACME_EMAIL=a@example.org \
            -v "$PWD/ops/compose/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Release package
        run: |
          mkdir -p /tmp/dist && echo '<!doctype html>' >/tmp/dist/index.html
          ops/release/build-release.sh --version 0.0.0 --out /tmp/release --frontend-dist /tmp/dist
          (cd /tmp/release && sha256sum -c SHA256SUMS)

  build-check-frontend:
    name: Frontend Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build production bundle
        working-directory: frontend
        run: npm run build-only
        env:
          VITE_API_BASE_URL: /api/v1
