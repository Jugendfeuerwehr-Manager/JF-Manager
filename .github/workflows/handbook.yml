name: Benutzerhandbuch

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'scripts/docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - '.github/workflows/handbook.yml'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - '.github/workflows/handbook.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: Auf GitHub Pages veröffentlichen
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: handbook-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: python -m pip install -r requirements-docs.txt
      - run: python -m unittest discover -s scripts/docs -p 'test_*.py'
      - run: python scripts/docs/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: jf-manager-handbook
          path: .docs-build/jf-manager-handbook.zip
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
        with:
          path: .docs-build/site
  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
