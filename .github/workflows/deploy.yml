name: Deploy

# Updates an installation managed by jfctl to a published release. The server
# verifies the release itself (checksums, provenance), backs up, migrates and
# rolls back on failure; this workflow only triggers "jfctl update".
# No git checkout, pull or build happens on the server (OPS-03.3).

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
      version:
        description: 'Release version to install (X.Y.Z, must exist as release v<X.Y.Z>)'
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ${{ github.event.inputs.version }} to ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    concurrency:
      group: deploy-${{ github.event.inputs.environment }}
      cancel-in-progress: false

    steps:
      - name: Validate version
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          [[ ${VERSION#v} =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || { echo "Ungültige Version: $VERSION"; exit 1; }
          echo "VERSION=${VERSION#v}" >>"$GITHUB_ENV"

      - name: Run jfctl update on the server
        uses: appleboy/ssh-action@v1.0.0
        env:
          VERSION: ${{ env.VERSION }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: VERSION
          script: |
            set -euo pipefail
            # Exit codes: 0 updated, 3 precheck failed (nothing changed),
            # 4 another jfctl operation runs, 7 rolled back, others: see jfctl log.
            sudo /usr/local/sbin/jfctl --non-interactive --yes update --version "$VERSION"
            sudo /usr/local/sbin/jfctl status
